services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: elearning_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elearning_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-elearning_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elearning-network

  # -------------------------------------------------------------
  # 2. Redis Cache & Blacklist Service
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: elearning_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elearning-network

  # -------------------------------------------------------------
  # 3. Spring Boot Backend Application
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning_backend
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-elearning_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      CLOUD_NAME: ${CLOUD_NAME}
      CLOUD_API_KEY: ${CLOUD_API_KEY}
      CLOUD_API_SECRET: ${CLOUD_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elearning-network

  # -------------------------------------------------------------
  # 4. Adminer — Web UI for PostgreSQL (dev only)
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: elearning_adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elearning-network

# -------------------------------------------------------------
# Networks & Persistent Volumes
# -------------------------------------------------------------
networks:
  elearning-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
