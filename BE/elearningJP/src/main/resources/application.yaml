spring:
  application:
    name: e-learning Japan
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      validation-timeout: 5000
      maximum-pool-size: 10
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      repositories:
        enabled: false
  config:
    import: optional:file:.env[.properties]
  jpa:
    properties:
      hibernate:
        # Múi giờ nghiệp vụ — khớp Clock bean (Asia/Ho_Chi_Minh).
        # Timestamp trong DB là TIMESTAMPTZ (lưu UTC, hiển thị theo múi giờ session).
        # Set múi giờ ở đây để timestamp đọc ra/hiển thị nhất quán ở mọi môi trường.
        # KHÔNG ảnh hưởng cột DATE (stat_date, last_activity_date) — DATE không lưu timezone.
        jdbc:
          time_zone: Asia/Ho_Chi_Minh


server:
  port: ${PORT:8080}

