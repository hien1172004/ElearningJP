spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  cache:
    type: redis
    redis:
      time-to-live: 600000          # default 10 phút (milliseconds)
      cache-null-values: false       # không cache giá trị null
      use-key-prefix: true           # caches jeden namespaced theo tên cache
      key-prefix: "elearningjp:"     # prefix chung

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000
      repositories:
        enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none   # Flyway handles database DDL migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 3600
  refreshable-duration: 86400

server:
  port: 8080

app:
  frontend-url: http://localhost:3000
  ai-service-url: ${AI_SERVICE_URL:http://host.docker.internal:8000}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  # Web Push (VAPID). KHÔNG commit private key thật vào repo — đây chỉ là key dev.
  # Production: ghi đè bằng biến môi trường VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY.
  web-push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:BFckzKFFMX4TAtW1lVLtLF8dad9YOyI2Eww2JWSeY845Xz869lC5IMTHsXOujNfAzI6dgbULc8bcFGmU5YLeC1c}
    vapid-private-key: ${VAPID_PRIVATE_KEY:CS8bP2-1rbsF5hGwtoldWAUZM9Ny4kZ_Z5chII3MFS0}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@elearningjp.com}
  # Cổng thanh toán VietQR PayOS
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/pricing}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/pricing}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true
    try-it-out-enabled: true
    persistAuthorization: true
    filter: true

management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

