<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElearningJP - Nền tảng học tiếng Nhật thông minh</title>
    <script>
      window.global = window;
      // Chống nháy trắng: gắn class .dark trước khi React render (khoá trùng stores/useThemeStore.ts)
      (function () {
        try {
          var m = localStorage.getItem('elearning-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
